[project]
name = "vren-backend"
version = "0.1.0"
description = "Vren AI backend: speech-to-text, question detection, grounded answers, practice interviews and review, with auth and CV workflows"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "google-genai>=2.30.1",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.2.3",
  "pwdlib[argon2]>=0.2.1",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.9.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.17",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
  "pypdf>=7.0.1",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vren AI Permissions</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f3ec;
        color: #17211e;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #e4dec9;
        border-radius: 14px;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .badge {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #14362b;
        color: #f6f3ec;
        display: inline-grid;
        place-items: center;
        font-size: 12px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #59635f;
      }
      .status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #faf8f3;
        font-size: 13px;
        font-weight: 500;
      }
      .status.ok {
        background: #ecfdf5;
        color: #166534;
      }
      .status.err {
        background: #fef2f2;
        color: #991b1b;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .primary {
        background: #14362b;
        color: #f6f3ec;
        flex: 1;
      }
      .secondary {
        background: #ffffff;
        border: 1px solid #d9d2c0;
        color: #17211e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <span class="badge">V</span>
        <span>Vren AI</span>
      </div>
      <h1>Microphone access for live interviews</h1>
      <p>
        Chrome requires granting microphone access in a full tab once before Vren AI can capture your voice from the Side Panel or floating window. Raw audio is never saved to disk.
      </p>
      <div id="status" class="status">Checking current microphone permission...</div>
      <div class="actions">
        <button id="allow-btn" class="primary" type="button">Allow microphone</button>
        <button id="close-btn" class="secondary" type="button">Close tab</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

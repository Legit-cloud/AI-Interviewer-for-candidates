<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow the microphone · Vren AI</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f7f4ee; color: #17332b; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #1f5c4a; color: #fff; cursor: pointer; }
      p.err { color: #9b2c2c; }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px">Let Vren hear you</h1>
      <p>Vren will also listen to your voice, so the answers fit what you just said. Chrome will ask you to allow it.</p>
      <button id="allow">Allow microphone</button>
      <p id="msg" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
